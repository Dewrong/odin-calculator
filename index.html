<!DOCTYPE html>
<header>
    <script src="calculator.js"></script>
    <style href="styles.css"></style>
</header>

<body>
    <span>Here's a calculator in the console for now, adding non-functional buttons.</span>
    <div class="calculator">
        <div class="input-display">
            <div class="history">8 + 4 = 12</div>
            <div class="current">12+4</div>
        </div>
        <div class="numeric buttons">
            <button>1</button>
            <button>2</button>
            <button>3</button>
            <button>4</button>
            <button>5</button>
            <button>6</button>
            <button>7</button>
            <button>8</button>
            <button>9</button>
            <button>0</button>
        </div>
        <div class="operator buttons">
            <button>+</button>
            <button>-</button>
            <button>/</button>
            <button>*</button>
            <button>=</button>
        </div>
    </div>
</body>
