<!DOCTYPE html>
<header>
    <script src="calculator.js"></script>
    <style href="styles.css"></style>
</header>

<body>
    <span>Here's a calculator in the console for now, adding non-functional buttons.</span>
    <div class="calculator">
        <div class="input-display">
            <div class="history" id="history"></div>
            <div class="current" id="current-numbers"></div>
        </div>
        <div class="numeric buttons">
            <button value="1" onclick="typeToCurrent(this.value)">1</button>
            <button value="2" onclick="typeToCurrent(this.value)">2</button>
            <button value="3" onclick="typeToCurrent(this.value)">3</button>
            <button value="4" onclick="typeToCurrent(this.value)">4</button>
            <button value="5" onclick="typeToCurrent(this.value)">5</button>
            <button value="6" onclick="typeToCurrent(this.value)">6</button>
            <button value="7" onclick="typeToCurrent(this.value)">7</button>
            <button value="8" onclick="typeToCurrent(this.value)">8</button>
            <button value="9" onclick="typeToCurrent(this.value)">9</button>
            <button value="0" onclick="typeToCurrent(this.value)">0</button>
        </div>
        <div class="operator buttons">
            <button value="+" onclick="operate(this.value)">+</button>
            <button value="-" onclick="operate(this.value)">-</button>
            <button value="/" onclick="operate(this.value)">/</button>
            <button value="*" onclick="operate(this.value)">*</button>
            <button value="=" onclick="operate(this.value)">=</button>
        </div>
        <div>
            <button value="CE" onclick="clearInput()">CE</button>
        </div>
    </div>
</body>
